<!DOCTYPE html><html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#06140d">
<title>BAUTIBOBICHBALL 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06140d;color:white;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#top{position:absolute;top:env(safe-area-inset-top,8px);left:50%;transform:translateX(-50%);width:min(94%,520px);padding:10px 15px;border:1px solid #ffffff30;border-radius:16px;background:#06140ddf;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:3;box-shadow:0 5px 25px #0008}
.team{font-weight:900;font-size:clamp(12px,3.5vw,17px)}
.green{color:#58ff85}.red{color:#ff6262}
#score{font-size:clamp(25px,7vw,36px);font-weight:1000;letter-spacing:2px;white-space:nowrap}
#status{position:absolute;top:95px;left:50%;transform:translateX(-50%);background:#07140de8;border:1px solid #ffffff35;border-radius:30px;padding:8px 14px;font-weight:bold;font-size:12px;white-space:nowrap;z-index:3;text-align:center}
#controls{position:absolute;inset:auto 0 max(15px,env(safe-area-inset-bottom,15px));display:flex;justify-content:space-between;align-items:end;padding:0 14px;z-index:4;pointer-events:none}
.pad,.actions{pointer-events:auto;display:grid;gap:7px}
.pad{grid-template-columns:repeat(3,clamp(48px,14vw,68px));grid-template-rows:repeat(2,clamp(48px,14vw,68px))}
.actions{grid-template-columns:repeat(2,clamp(62px,17vw,82px));grid-template-rows:repeat(2,clamp(48px,13vw,64px))}
button{color:white;border:1px solid #ffffff55;background:#10271fe8;border-radius:16px;font-size:clamp(17px,5vw,24px);font-weight:900;box-shadow:0 5px 0 #0007;touch-action:none;user-select:none}
button:active,.held{background:#267a49;transform:translateY(2px);box-shadow:0 2px 0 #0007}
.pad button{background:#10271fdd}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.actions button{font-size:12px;line-height:1.25}
.actions .shoot{background:#a92b2b}.actions .pass{background:#155d3b}
#restart{position:absolute;top:155px;left:50%;transform:translateX(-50%);z-index:5;display:none;background:#e7b839;color:#101010;padding:13px 20px;font-size:15px;border:0;border-radius:12px}
#help{position:absolute;left:50%;bottom:155px;transform:translateX(-50%);font-size:10px;color:#ffffffa8;white-space:nowrap;pointer-events:none}
@media(orientation:portrait){#help{bottom:155px}}
@media(orientation:landscape){#top{padding:6px 12px}#status{top:65px}#controls{padding:0 10px}.pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px)}.actions{grid-template-columns:repeat(2,66px);grid-template-rows:repeat(2,46px)}#help{bottom:105px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top">
  <div class="team green">🟢 VERDE <span id="gnum">0</span></div>
  <div id="score">0 - 0</div>
  <div class="team red">ROJO <span id="rnum">0</span> 🔴</div>
</div>
<div id="status">PARTIDO EN JUEGO · PRIMERO A 10</div>
<button id="restart">JUGAR DE NUEVO</button>
<div id="help">MOVER · PASE · TIRO</div>
<div id="controls">
  <div class="pad">
    <button class="up" data-move="up">▲</button>
    <button class="left" data-move="left">◀</button>
    <button class="down" data-move="down">▼</button>
    <button class="right" data-move="right">▶</button>
  </div>
  <div class="actions">
    <button class="pass" id="pass">PASE</button>
    <button class="shoot" id="shoot">⚽ TIRO</button>
    <button id="switch">CAMBIAR<br>JUGADOR</button>
    <button id="sprint">🏃 CORRER</button>
  </div>
</div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(() => {
'use strict';
const holder=document.getElementById('game');
if(!window.THREE){
  document.getElementById('status').textContent='No se pudo cargar Three.js. Revisá tu conexión a Internet.';
  return;
}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87bde0);
scene.fog=new THREE.Fog(0x87bde0,100,190);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,400);
camera.position.set(0,48,57);
camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
holder.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9f0ff,0x23411b,2.0));
const sun=new THREE.DirectionalLight(0xffffff,2.1);
sun.position.set(-25,45,30);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-65;sun.shadow.camera.right=65;
sun.shadow.camera.top=50;sun.shadow.camera.bottom=-50;
scene.add(sun);

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const grass1=mat(0x167a35),grass2=mat(0x218b3d);
const white=mat(0xffffff),dark=mat(0x18241b),ballMat=mat(0xffffff,.35);
const greenMat=mat(0x15d94b),greenDark=mat(0x08752c);
const redMat=mat(0xf03737),redDark=mat(0x941d27);
const skin=mat(0xd6a078),shoe=mat(0x151515);
const FIELD_X=100,FIELD_Z=62,HALF_X=50,HALF_Z=31;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);

function box(parent,w,h,d,material,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function sphere(parent,r,material,x,y,z,segments=12){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,segments,Math.max(8,segments-2)),material);
  m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}
function line(points,material=white,radius=.065){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],.075,p[1])));
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(12,points.length*4),radius,5,false),material);
  scene.add(mesh);return mesh;
}

// Campo con franjas y líneas
box(scene,FIELD_X,.3,FIELD_Z,grass1,0,-.25,0);
for(let i=0;i<10;i++){
  box(scene,FIELD_X/10,.015,FIELD_Z,i%2?grass1:grass2,-45+i*10,.0,0);
}
const outline=[[-50,-31],[50,-31],[50,31],[-50,31],[-50,-31]];
line(outline,white,.09);
line([[0,-31],[0,31]],white,.07);
const circle=[];
for(let i=0;i<=64;i++){const a=i/64*Math.PI*2;circle.push([Math.cos(a)*9.15,Math.sin(a)*9.15]);}
line(circle,white,.07);
sphere(scene,.12,white,0,.08,0,8);
for(const s of [-1,1]){
  line([[s*50,-20],[s*34,-20],[s*34,20],[s*50,20]],white,.07);
  line([[s*50,-10],[s*42,-10],[s*42,10],[s*50,10]],white,.07);
  sphere(scene,.13,white,s*42,.08,0,8);
}
function makeGoal(side){
  const x=side*51;
  const goalMat=mat(0xffffff,.4);
  box(scene,.28,4.3,14,goalMat,x,2.15,0);
  box(scene,3.4,.22,.22,goalMat,side*52.4,4.25,-7);
  box(scene,3.4,.22,.22,goalMat,side*52.4,4.25,7);
  box(scene,.22,4.3,.22,goalMat,side*52.4,2.15,-7);
  box(scene,.22,4.3,.22,goalMat,side*52.4,2.15,7);
  const net=mat(0xcde5ee,.95);
  for(let z=-6.5;z<=6.5;z+=1.3)box(scene,2.8,.035,.035,net,side*53.7,2.1,z);
  for(let y=.5;y<=4;y+=.7)box(scene,2.8,.035,.035,net,side*53.7,y,0);
}
makeGoal(-1);makeGoal(1);

// Tribunas sencillas
const standMat=mat(0x34434b),seat1=mat(0x244f87),seat2=mat(0x9b2633);
for(const side of [-1,1]){
  box(scene,108,4,5,standMat,0,1.7,side*36);
  for(let row=0;row<3;row++){
    for(let x=-48;x<=48;x+=3.3){
      box(scene,2.4,.65,1.15,(Math.floor(x/3.3)+row)%2?seat1:seat2,x,3.5+row*.65,side*(34.3+row*.8));
    }
  }
}
box(scene,110,.6,85,mat(0x37433e),0,-3.2,0).receiveShadow=true;

// Jugadores
const players=[];
function createPlayer(team,index){
  const root=new THREE.Group();
  scene.add(root);
  const color=team===0?greenMat:redMat;
  const shorts=team===0?greenDark:redDark;
  const torso=box(root,1.05,1.25,.58,color,0,1.45,0);
  box(root,.76,.38,.65,shorts,0,.62,0);
  sphere(root,.39,skin,0,2.35,0,12);
  sphere(root,.42,color,0,2.35,-.04,12);
  // dejar visible la cara al frente
  sphere(root,.27,skin,0,2.28,-.31,12);
  box(root,.14,.15,.055,dark,0,2.34,-.55);
  const legs=[];
  for(const side of [-1,1]){
    const leg=box(root,.25,.75,.28,shorts,side*.29,.22,0);
    const foot=box(root,.3,.16,.48,shoe,side*.29,-.15,-.12);
    legs.push({leg,foot,side});
  }
  const arms=[];
  for(const side of [-1,1]){
    const arm=box(root,.24,.82,.27,color,side*.66,1.45,0);
    arms.push({arm,side});
  }
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(.62,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.2}));
  shadow.rotation.x=-Math.PI/2;shadow.position.y=.025;root.add(shadow);
  const p={team,index,root,legs,arms,torso,x:0,z:0,vx:0,vz:0,
    angle:team===0?Math.PI/2:-Math.PI/2,phase:rand(0,6),speed:team===0?8.3:7.8};
  root.position.set(0,0,0);
  players.push(p);return p;
}
function createTeams(){
  while(players.length){const p=players.pop();scene.remove(p.root);}
  // Verde ataca hacia +X; rojo ataca hacia -X
  const greenPos=[[-35,0],[-23,-17],[-23,17],[-8,-10],[-8,10],[5,0]];
  const redPos=[[35,0],[23,-17],[23,17],[8,-10],[8,10],[-5,0]];
  greenPos.forEach((pos,i)=>{const p=createPlayer(0,i);p.x=pos[0];p.z=pos[1];});
  redPos.forEach((pos,i)=>{const p=createPlayer(1,i);p.x=pos[0];p.z=pos[1];});
}
createTeams();

const ball=new THREE.Group();scene.add(ball);
sphere(ball,.62,ballMat,0,.62,0,16);
const black=mat(0x171717,.65);
for(let i=0;i<5;i++){
  const a=i*Math.PI*2/5;
  const patch=sphere(ball,.17,black,Math.cos(a)*.43,.62+Math.sin(a)*.23,Math.sin(a)*.43,7);
  patch.scale.set(1,.8,.7);
}
const ballShadow=new THREE.Mesh(new THREE.CircleGeometry(.72,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.25}));
ballShadow.rotation.x=-Math.PI/2;ballShadow.position.y=.02;scene.add(ballShadow);

let bx=0,bz=0,bvx=0,bvz=0;
let scoreG=0,scoreR=0,finished=false,resetTimer=0,kickoffTeam=0;
let selected=0,shootCooldown=0,goalLock=0;
const input={up:false,down:false,left:false,right:false,sprint:false};
const status=document.getElementById('status');
const restartBtn=document.getElementById('restart');
function updateScore(){
  document.getElementById('score').textContent=scoreG+' - '+scoreR;
  document.getElementById('gnum').textContent=scoreG;
  document.getElementById('rnum').textContent=scoreR;
}
function setStatus(text){status.textContent=text;}
function resetPositions(){
  const greenPos=[[-35,0],[-23,-17],[-23,17],[-8,-10],[-8,10],[5,0]];
  const redPos=[[35,0],[23,-17],[23,17],[8,-10],[8,10],[-5,0]];
  players.forEach(p=>{
    const pos=(p.team===0?greenPos:redPos)[p.index];
    p.x=pos[0];p.z=pos[1];p.vx=0;p.vz=0;
    p.root.position.set(p.x,0,p.z);
  });
  bx=0;bz=0;bvx=0;bvz=0;
  ball.position.set(0,0,0);
  ballShadow.position.set(0,.025,0);
}
function goal(team){
  if(goalLock>0||finished)return;
  goalLock=2.2;
  if(team===0)scoreG++;else scoreR++;
  updateScore();
  // El equipo que recibió el gol hace el saque
  kickoffTeam=team===0?1:0;
  resetPositions();
  players.forEach(p=>{
    if(p.team===kickoffTeam){p.x=(p.team===0?-2:2)+(p.index%3)*1.1;p.z=(p.index-2.5)*1.5;p.root.position.set(p.x,0,p.z);}
  });
  // Pelota quieta en el centro hasta que el saque la mueva
  bx=0;bz=0;bvx=0;bvz=0;
  if(scoreG>=10||scoreR>=10){
    finished=true;
    setStatus(scoreG>scoreR?'🏆 ¡GANÓ EL VERDE!':'🏆 ¡GANÓ EL ROJO!');
    restartBtn.style.display='block';
  }else{
    setStatus((team===0?'⚽ ¡GOL DEL VERDE!':'⚽ ¡GOL DEL ROJO!')+
      ' · SACA '+(kickoffTeam===0?'EL VERDE':'EL ROJO'));
    resetTimer=1.25;
  }
}
function nearestPlayerToBall(team){
  let best=null,dist=Infinity;
  for(const p of players)if(p.team===team){
    const d=Math.hypot(p.x-bx,p.z-bz);
    if(d<dist){dist=d;best=p;}
  }
  return best;
}
function moveToward(p,tx,tz,speed,dt){
  let dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);
  if(d>.12){dx/=d;dz/=d;}else{dx=0;dz=0;}
  // suavizar aceleración para que el movimiento sea continuo
  const targetX=dx*speed,targetZ=dz*speed;
  p.vx+=(targetX-p.vx)*Math.min(1,dt*5.5);
  p.vz+=(targetZ-p.vz)*Math.min(1,dt*5.5);
  p.x+=p.vx*dt;p.z+=p.vz*dt;
  p.x=clamp(p.x,-48,48);p.z=clamp(p.z,-29,29);
  if(Math.hypot(p.vx,p.vz)>.25)p.angle=Math.atan2(-p.vz,-p.vx);
}
function animatePlayer(p,dt,time){
  p.root.position.set(p.x,Math.abs(Math.sin(time*9+p.phase))*.06, p.z);
  p.root.rotation.y=p.angle;
  const speed=Math.hypot(p.vx,p.vz);
  const swing=Math.sin(time*10+p.phase)*Math.min(1,speed/3)*.48;
  p.legs.forEach(l=>{l.leg.rotation.x=swing*l.side;l.foot.rotation.x=swing*l.side;});
  p.arms.forEach(a=>a.arm.rotation.x=-swing*a.side*.8);
}
function shootBall(p,power=17){
  if(finished||resetTimer>0||shootCooldown>0)return;
  const dir=p.team===0?1:-1;
  const aimZ=clamp(bz*-.16+rand(-2.3,2.3),-5.5,5.5);
  bvx=dir*power;
  bvz=clamp((aimZ-bz)*.55,-5,5);
  shootCooldown=.55;
  bx=p.x+dir*1.1;bz=p.z;
}
function passBall(p){
  if(finished||resetTimer>0||shootCooldown>0)return;
  let target=null,best=Infinity;
  for(const q of players)if(q.team===p.team&&q!==p){
    const forward=(q.x-p.x)*(p.team===0?1:-1);
    const d=Math.hypot(q.x-p.x,q.z-p.z);
    if(forward>-2&&d<best){best=d;target=q;}
  }
  if(!target){shootBall(p,10);return;}
  const dx=target.x-bx,dz=target.z-bz,d=Math.max(.1,Math.hypot(dx,dz));
  bvx=dx/d*13;bvz=dz/d*13;shootCooldown=.4;
}
function chooseSelected(){
  const p=nearestPlayerToBall(0);
  if(p)selected=p.index;
}
function selectedPlayer(){return players.find(p=>p.team===0&&p.index===selected)||players[0];}
function restart(){
  scoreG=0;scoreR=0;finished=false;resetTimer=0;goalLock=0;
  shootCooldown=0;restartBtn.style.display='none';updateScore();
  createTeams();resetPositions();chooseSelected();
  setStatus('PARTIDO EN JUEGO · PRIMERO A 10');
}
restartBtn.addEventListener('pointerdown',e=>{e.preventDefault();restart();});

function update(dt,time){
  shootCooldown=Math.max(0,shootCooldown-dt);
  goalLock=Math.max(0,goalLock-dt);
  if(finished){
    players.forEach(p=>{p.vx*=.94;p.vz*=.94;animatePlayer(p,dt,time);});
    return;
  }
  if(resetTimer>0){
    resetTimer-=dt;
    // El equipo que recibió el gol inicia el saque tras una breve pausa
    if(resetTimer<=0){
      const kicker=players.find(p=>p.team===kickoffTeam);
      if(kicker){
        kicker.x=kickoffTeam===0?-1.2:1.2;kicker.z=0;
        bx=kickoffTeam===0?-.4:.4;bz=0;
        bvx=kickoffTeam===0?8:-8;bvz=rand(-1,1);
        setStatus('PARTIDO EN JUEGO · '+(kickoffTeam===0?'SAQUE VERDE':'SAQUE ROJO'));
      }
    }
    players.forEach(p=>animatePlayer(p,dt,time));
    ball.position.set(bx,.62,bz);ballShadow.position.set(bx,.025,bz);
    return;
  }

  const human=selectedPlayer();
  let mx=(input.right?1:0)-(input.left?1:0);
  let mz=(input.down?1:0)-(input.up?1:0);
  const mag=Math.hypot(mx,mz);
  if(mag>0){mx/=mag;mz/=mag;}
  const userSpeed=input.sprint?12:9;
  if(human){
    const tx=human.x+mx*5,tz=human.z+mz*5;
    if(mag>0)moveToward(human,tx,tz,userSpeed,dt);
    else{
      // Incluso sin tocar controles, el jugador elegido se mueve buscando la pelota
      const d=Math.hypot(bx-human.x,bz-human.z);
      if(d>2.3)moveToward(human,bx,bz,8.4,dt);
      else moveToward(human,human.x+Math.cos(time*1.5)*.5,human.z+Math.sin(time*1.3)*.5,1.8,dt);
    }
  }

  // Ambos equipos se desplazan continuamente: presión, apoyo y defensa.
  for(const p of players){
    if(p===human)continue;
    const dir=p.team===0?1:-1;
    const chase=nearestPlayerToBall(p.team);
    const isChaser=chase===p;
    let tx,tz;
    if(isChaser){
      tx=bx-dir*.8;tz=bz;
    }else{
      const homeX=(p.team===0?[-35,-23,-23,-8,-8,5]:[35,23,23,8,8,-5])[p.index];
      const homeZ=(p.index===0?0:p.index%2===0?12:-12);
      tx=homeX+(bx*.20);
      tz=homeZ+bz*.23;
      if(Math.hypot(bx-p.x,bz-p.z)<10){tx=bx-dir*3;tz=bz+(p.index%2?3:-3);}
    }
    moveToward(p,tx,tz,isChaser?8.5:5.3,dt);
  }

  // Choques jugador-pelota: un toque cambia la dirección y permite recuperar.
  for(const p of players){
    const dx=bx-p.x,dz=bz-p.z,d=Math.hypot(dx,dz);
    if(d<1.65){
      const dir=p.team===0?1:-1;
      if(Math.abs(bvx)+Math.abs(bvz)<2.8 || dx*dir<1.1){
        bvx+=dir*(p===human&&mag>0?4.2:3.2);
        bvz+=(bz-p.z)*1.4+(Math.random()-.5)*1.1;
        bvx=clamp(bvx,-14,14);bvz=clamp(bvz,-8,8);
      }
      // Si el jugador llega a la pelota, puede rematar automáticamente
      if(Math.abs(bx)<46&&Math.random()<dt*.36&&Math.abs(bvx)<7){
        bvx=dir*13;bvz=clamp(-bz*.25+rand(-2,2),-5,5);
      }
    }
  }

  bx+=bvx*dt;bz+=bvz*dt;
  const friction=Math.pow(.985,dt*60);
  bvx*=friction;bvz*=friction;
  if(Math.abs(bvz)<.08)bvz=0;
  if(Math.abs(bvx)<.08)bvx=0;

  // Laterales del campo
  if(bz>HALF_Z-.7){bz=HALF_Z-.7;bvz=-Math.abs(bvz)*.75;}
  if(bz< -HALF_Z+.7){bz=-HALF_Z+.7;bvz=Math.abs(bvz)*.75;}

  // Gol solo si la pelota cruza la línea dentro de los postes.
  if(bx>HALF_X-.2&&Math.abs(bz)<6.8){goal(0);return;}
  if(bx< -HALF_X+.2&&Math.abs(bz)<6.8){goal(1);return;}

  // Pelota fuera por el fondo: vuelve al campo, sin contar gol.
  if(bx>HALF_X+.5||bx< -HALF_X-.5){
    bx=clamp(bx,-HALF_X+.5,HALF_X-.5);bvx*=-.55;
  }

  ball.position.set(bx,.62,bz);
  ball.rotation.z-=bvz*dt*.8;
  ball.rotation.x+=bvx*dt*.7;
  ballShadow.position.set(bx,.025,bz);

  players.forEach(p=>animatePlayer(p,dt,time));
}

const keys={};
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key==='ArrowUp')input.up=true;
  if(e.key==='ArrowDown')input.down=true;
  if(e.key==='ArrowLeft')input.left=true;
  if(e.key==='ArrowRight')input.right=true;
  if(e.key===' '){e.preventDefault();shootBall(selectedPlayer(),19);}
});
addEventListener('keyup',e=>{
  keys[e.key.toLowerCase()]=false;
  if(e.key==='ArrowUp')input.up=false;
  if(e.key==='ArrowDown')input.down=false;
  if(e.key==='ArrowLeft')input.left=false;
  if(e.key==='ArrowRight')input.right=false;
});
document.querySelectorAll('[data-move]').forEach(btn=>{
  const name=btn.dataset.move;
  const down=e=>{e.preventDefault();input[name]=true;btn.classList.add('held');};
  const up=e=>{e.preventDefault();input[name]=false;btn.classList.remove('held');};
  btn.addEventListener('pointerdown',down);
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointercancel',up);
  btn.addEventListener('pointerleave',e=>{if(e.buttons===0)up(e);});
});
function bindAction(id,fn){
  document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();fn();});
}
bindAction('shoot',()=>shootBall(selectedPlayer(),19));
bindAction('pass',()=>passBall(selectedPlayer()));
bindAction('switch',()=>{
  const p=nearestPlayerToBall(0);
  selected=p?p.index:(selected+1)%6;
  const b=document.getElementById('switch');
  b.classList.add('held');setTimeout(()=>b.classList.remove('held'),120);
});
const sprintBtn=document.getElementById('sprint');
sprintBtn.addEventListener('pointerdown',e=>{e.preventDefault();input.sprint=true;sprintBtn.classList.add('held');});
function sprintOff(e){input.sprint=false;sprintBtn.classList.remove('held');}
sprintBtn.addEventListener('pointerup',sprintOff);
sprintBtn.addEventListener('pointercancel',sprintOff);
sprintBtn.addEventListener('pointerleave',e=>{if(e.buttons===0)sprintOff(e);});

// Cámara diagonal que acompaña la zona de juego
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.04,(now-last)/1000);last=now;
  const time=now/1000;
  update(dt,time);
  const focusX=clamp(bx*.22,-10,10);
  camera.position.x+=(focusX-camera.position.x)*Math.min(1,dt*1.5);
  camera.lookAt(focusX*.45,0,0);
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
updateScore();
resetPositions();
chooseSelected();
})();
</script></body>
