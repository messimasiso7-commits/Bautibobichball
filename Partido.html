<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BAUTIBOBICHBALL | Partido 2D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#06120d;color:white;font-family:Arial,sans-serif;text-align:center;touch-action:manipulation}
header{padding:12px;background:#0d2418;border-bottom:2px solid #39ef86}
h1{margin:5px;font-size:22px;color:#53ff9a}
a,button{border:0;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer}
a{display:inline-block;background:#243b2d;color:white;text-decoration:none;margin:8px}
#scoreboard{display:flex;justify-content:center;align-items:center;gap:18px;padding:10px;font-size:22px;font-weight:bold}
.green{color:#4cff92}.red{color:#ff7777}
#clock{background:#183b27;border-radius:8px;padding:8px 14px}
#game{width:100%;max-width:1000px;margin:auto;position:relative}
canvas{width:100%;height:auto;display:block;background:#278c48;border:2px solid #76d99a;touch-action:none}
#message{padding:8px;color:#c4ffd9;min-height:30px}
.controls{max-width:700px;margin:10px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}
.controls button{background:#183b28;color:white;border:1px solid #3d8058;font-size:15px;min-height:48px}
.controls button:active{background:#39e982;color:#062010}
#joystick{width:130px;height:130px;border-radius:50%;background:#152d20;border:2px solid #5b9d72;position:relative;margin:8px auto;touch-action:none}
#stick{width:48px;height:48px;border-radius:50%;background:#53ff9a;position:absolute;left:39px;top:39px}
#start{background:#49f58c;color:#052010;font-size:18px}
.note{font-size:12px;color:#a7c9b3;padding:12px}
@media(max-width:480px){.controls{grid-template-columns:repeat(3,1fr);gap:6px}.controls button{font-size:13px;padding:8px}#scoreboard{gap:10px;font-size:18px}}
</style>
</head>
<body>
<header>
<h1>⚽ BAUTIBOBICHBALL</h1>
<div>PARTIDO 2D • MODO FÚTBOL</div>
<a href="index.html">⬅ VOLVER AL INICIO</a>
</header>

<div id="scoreboard">
<span class="green">VERDES</span>
<span id="score">0 - 0</span>
<span class="red">ROJOS</span>
<span id="clock">00:00</span>
</div>

<div id="game">
<canvas id="pitch" width="1000" height="600"></canvas>
</div>
<div id="message">¡Prepará tu equipo para jugar!</div>
<button id="start" onclick="startGame()">▶ COMENZAR PARTIDO</button>

<div id="joystick">
<div id="stick"></div>
</div>

<div class="controls">
<button onclick="passBall()">✋ PASE</button>
<button onclick="shoot()">🥅 REMATAR</button>
<button id="sprint">⚡ CORRER</button>
<button onclick="switchPlayer()">🔄 CAMBIAR</button>
<button onclick="tackle()">🦶 QUITAR</button>
<button onclick="togglePause()">⏸ PAUSA</button>
<button onclick="restart()">🔁 REINICIAR</button>
</div>

<div class="note">
Móvil: joystick y botones. PC: WASD o flechas para moverte, X para pasar,
espacio para rematar, C para cambiar jugador, E para quitar el balón y Shift para correr.
</div>

<script>
const canvas=document.getElementById("pitch");
const ctx=canvas.getContext("2d");
const W=1000,H=600;
const scoreEl=document.getElementById("score");
const clockEl=document.getElementById("clock");
const message=document.getElementById("message");
const stick=document.getElementById("stick");
const joystick=document.getElementById("joystick");

let players=[],ball={},active=0,goalsA=0,goalsB=0;
let playing=false,paused=false,gameTime=0,last=0;
let keys={},joyX=0,joyY=0,sprinting=false;
const field={x:35,y:35,w:930,h:530};

function makePlayer(x,y,team,index){
 return {x,y,team,index,vx:0,vy:0,r:15,
   color:team===0?"#55ff96":"#ff6464"};
}
function resetPositions(){
 players=[];
 for(let i=0;i<6;i++){
  players.push(makePlayer(130+(i%3)*100,150+Math.floor(i/3)*250,0,i));
 }
 for(let i=0;i<6;i++){
  players.push(makePlayer(870-(i%3)*100,150+Math.floor(i/3)*250,1,i));
 }
 active=1;
 ball={x:500,y:300,vx:0,vy:0,owner:null,r:9};
}
function restart(){
 goalsA=0;goalsB=0;gameTime=0;playing=false;paused=false;
 resetPositions();updateScore();
 message.textContent="Partido listo. ¡A jugar!";
 draw();
}
function startGame(){
 if(gameTime>=180){restart()}
 playing=true;paused=false;
 message.textContent="¡Partido en marcha!";
 last=performance.now();
}
function togglePause(){
 if(!playing)return;
 paused=!paused;
 message.textContent=paused?"Partido pausado":"¡Seguimos jugando!";
}
function updateScore(){
 scoreEl.textContent=goalsA+" - "+goalsB;
}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function controlled(){
 return players[active];
}
function moveControlled(dt){
 const p=controlled();
 if(!p)return;
 let dx=joyX,dy=joyY;
 if(keys.ArrowLeft||keys.a)dx-=1;
 if(keys.ArrowRight||keys.d)dx+=1;
 if(keys.ArrowUp||keys.w)dy-=1;
 if(keys.ArrowDown||keys.s)dy+=1;
 const len=Math.hypot(dx,dy);
 if(len>1){dx/=len;dy/=len}
 const speed=(sprinting||keys.Shift?270:190)*dt;
 p.x=clamp(p.x+dx*speed,field.x+12,field.x+field.w-12);
 p.y=clamp(p.y+dy*speed,field.y+12,field.y+field.h-12);
 if(ball.owner===active){
  ball.x=p.x+(dx||1)*23;
  ball.y=p.y+(dy||0)*18;
 }
}
function aiMove(dt){
 for(const p of players){
  if(p.index===controlled().index&&p.team===0)continue;
  if(ball.owner===players.indexOf(p))continue;
  let tx,ty;
  if(p.team===0){
   if(ball.owner===null){tx=ball.x;ty=ball.y}
   else if(players[ball.owner]?.team===1){tx=ball.x;ty=ball.y}
   else{tx=220+p.index*35;ty=100+p.index*75}
  }else{
   if(ball.owner===null||players[ball.owner]?.team===0){tx=ball.x;ty=ball.y}
   else{tx=ball.x-65;ty=ball.y}
  }
  let dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1;
  const speed=p.team===1?100:90;
  p.x=clamp(p.x+dx/d*speed*dt,field.x+12,field.x+field.w-12);
  p.y=clamp(p.y+dy/d*speed*dt,field.y+12,field.y+field.h-12);
  if(ball.owner===null&&distance(p,ball)<p.r+ball.r+3){
   ball.owner=players.indexOf(p);
  }
  if(ball.owner!==null&&players[ball.owner]?.team!==p.team&&distance(p,players[ball.owner])<25){
   if(Math.random()<0.015)ball.owner=players.indexOf(p);
  }
 }
}
function ballPhysics(dt){
 if(ball.owner!==null){
  const p=players[ball.owner];
  if(p){
   const dir=p.team===0?1:-1;
   ball.x=p.x+dir*21;
   ball.y=p.y;
  }else ball.owner=null;
 }else{
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  ball.vx*=Math.pow(.985,dt*60);
  ball.vy*=Math.pow(.985,dt*60);
  if(ball.y<field.y+8||ball.y>field.y+field.h-8)ball.vy*=-0.8;
  if(ball.x<field.x+8||ball.x>field.x+field.w-8)ball.vx*=-0.8;
  for(const p of players){
   if(distance(p,ball)<p.r+ball.r){
    ball.owner=players.indexOf(p);break;
   }
  }
 }
 // Goles
 if(ball.x<24&&ball.y>235&&ball.y<365){
  goalsB++;kickoff(1);updateScore();message.textContent="¡GOOOL DEL EQUIPO ROJO!";
 }
 if(ball.x>976&&ball.y>235&&ball.y<365){
  goalsA++;kickoff(0);updateScore();message.textContent="¡GOOOL DEL EQUIPO VERDE!";
 }
}
function kickoff(team){
 ball.x=500;ball.y=300;ball.vx=ball.vy=0;
 ball.owner=team===0?active:7;
 for(let i=0;i<players.length;i++){
  const p=players[i];
  p.x=p.team===0?130+(i%3)*100:870-(i%3)*100;
  p.y=150+(i%3)*130;
 }
}
function passBall(){
 const p=controlled();
 if(ball.owner!==active){message.textContent="Acercate al balón para pasar";return}
 let target=null,best=Infinity;
 for(const q of players){
  if(q.team!==0||q===p)continue;
  const d=distance(p,q);
  if(d<best){best=d;target=q}
 }
 if(target){
  ball.owner=null;
  let dx=target.x-ball.x,dy=target.y-ball.y,d=Math.hypot(dx,dy)||1;
  ball.vx=dx/d*390;ball.vy=dy/d*390;
  message.textContent="¡Buen pase!";
 }
}
function shoot(){
 if(ball.owner!==active){message.textContent="¡Primero conseguí el balón!";return}
 const p=controlled();
 ball.owner=null;
 ball.x=p.x+(p.team===0?20:-20);
 ball.y=p.y;
 ball.vx=600;ball.vy=(300-p.y)*1.1;
 message.textContent="¡Remate al arco!";
}
function switchPlayer(){
 let best=Infinity,chosen=active;
 for(let i=0;i<6;i++){
  const d=distance(players[i],ball);
  if(d<best){best=d;chosen=i}
 }
 active=chosen;
 message.textContent="Jugador "+(active+1);
}
function tackle(){
 const p=controlled();
 if(ball.owner===null&&distance(p,ball)<65){
  ball.owner=active;message.textContent="¡Recuperaste el balón!";
 }else if(ball.owner!==null&&players[ball.owner]?.team===1&&distance(p,players[ball.owner])<55){
  ball.owner=active;message.textContent="¡Quitaste la pelota!";
 }else{
  p.x=clamp(p.x+(ball.x-p.x)*0.12,field.x,field.x+field.w);
  p.y=clamp(p.y+(ball.y-p.y)*0.12,field.y,field.y+field.h);
  message.textContent="¡Presioná al rival!";
 }
}
function drawPitch(){
 ctx.fillStyle="#218447";ctx.fillRect(0,0,W,H);
 for(let i=0;i<10;i++){
  ctx.fillStyle=i%2===0?"#278d4d":"#238247";
  ctx.fillRect(field.x+i*field.w/10,field.y,field.w/10,field.h);
 }
 ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=3;
 ctx.strokeRect(field.x,field.y,field.w,field.h);
 ctx.beginPath();ctx.moveTo(500,field.y);ctx.lineTo(500,field.y+field.h);ctx.stroke();
 ctx.beginPath();ctx.arc(500,300,75,0,Math.PI*2);ctx.stroke();
 ctx.strokeRect(field.x,190,125,220);ctx.strokeRect(field.x,235,55,130);
 ctx.strokeRect(field.x+field.w-125,190,125,220);
 ctx.strokeRect(field.x+field.w-55,235,55,130);
 ctx.fillStyle="#e9fff0";
 ctx.fillRect(0,235,field.x,130);
 ctx.fillRect(field.x+field.w,235,W-(field.x+field.w),130);
 ctx.fillStyle="#fff";ctx.fillRect(0,235,19,130);ctx.fillRect(981,235,19,130);
}
function draw(){
 drawPitch();
 for(const p of players){
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fillStyle=p.color;ctx.fill();
  ctx.lineWidth=(p.team===0&&p.index===active)?4:2;
  ctx.strokeStyle=(p.team===0&&p.index===active)?"#ffffff":"#102018";
  ctx.stroke();
  ctx.fillStyle="#082015";ctx.font="bold 12px Arial";
  ctx.textAlign="center";ctx.fillText(p.index+1,p.x,p.y+4);
  if(p.team===0&&p.index===active){
   ctx.beginPath();ctx.moveTo(p.x,p.y-25);ctx.lineTo(p.x-8,p.y-36);ctx.lineTo(p.x+8,p.y-36);ctx.closePath();
   ctx.fillStyle="#fff";ctx.fill();
  }
 }
 ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
 ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#111";ctx.lineWidth=2;ctx.stroke();
 ctx.beginPath();ctx.arc(ball.x-2,ball.y-2,3,0,Math.PI*2);
 ctx.fillStyle="#222";ctx.fill();
}
function loop(now){
 const dt=Math.min((now-last)/1000||0,0.035);
 last=now;
 if(playing&&!paused){
  gameTime+=dt;
  moveControlled(dt);
  aiMove(dt);
  ballPhysics(dt);
  if(gameTime>=180){
   gameTime=180;playing=false;
   message.textContent=goalsA>goalsB?"¡GANÓ EL EQUIPO VERDE!":goalsA<goalsB?"¡GANÓ EL EQUIPO ROJO!":"¡EMPATE!";
  }
  const secs=Math.floor(gameTime/180*90*60);
  clockEl.textContent=String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0");
 }
 draw();
 requestAnimationFrame(loop);
}
document.addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(e.key===" "){e.preventDefault();shoot()}
 if(e.key.toLowerCase()==="x")passBall();
 if(e.key.toLowerCase()==="c")switchPlayer();
 if(e.key.toLowerCase()==="e")tackle();
});
document.addEventListener("keyup",e=>keys[e.key]=false);

let joyPointer=null;
joystick.addEventListener("pointerdown",e=>{
 joyPointer=e.pointerId;joystick.setPointerCapture(e.pointerId);joyUpdate(e);
});
joystick.addEventListener("pointermove",e=>{if(e.pointerId===joyPointer)joyUpdate(e)});
function joyUpdate(e){
 const r=joystick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=42,len=Math.hypot(dx,dy)||1;
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 joyX=dx/max;joyY=dy/max;
 stick.style.left=(39+dx)+"px";stick.style.top=(39+dy)+"px";
}
function resetJoy(){
 joyPointer=null;joyX=0;joyY=0;
 stick.style.left="39px";stick.style.top="39px";
}
joystick.addEventListener("pointerup",resetJoy);
joystick.addEventListener("pointercancel",resetJoy);
const sprintBtn=document.getElementById("sprint");
sprintBtn.addEventListener("pointerdown",e=>{sprinting=true;sprintBtn.setPointerCapture(e.pointerId)});
sprintBtn.addEventListener("pointerup",()=>sprinting=false);
sprintBtn.addEventListener("pointercancel",()=>sprinting=false);
sprintBtn.addEventListener("lostpointercapture",()=>sprinting=false);

resetPositions();draw();requestAnimationFrame(loop);
</script>
</body>
</html>
